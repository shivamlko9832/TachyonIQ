[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uada"
version = "0.1.0"
description = "Unified Analytics Data Agent — Conversational Analytics Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # Agent orchestration
    "pydantic-ai>=2.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # API layer
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # Database connectivity
    "sqlalchemy>=2.0.41",
    "psycopg2-binary>=2.9.0",      # PostgreSQL
    "pymysql>=1.1.0",              # MySQL
    "pyodbc>=5.1.0",               # SQL Server

    # SQL parsing and validation
    "sqlglot>=26.0.0",

    # Retrieval
    "chromadb>=0.5.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0.0",

    # Data analysis
    "duckdb>=1.1.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",

    # Visualization
    "altair>=5.3.0",

    # Observability
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp-proto-http>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "logfire[pydantic-ai]>=0.50.0",

    # Utilities
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-pyyaml",
    "types-psycopg2",
    "deepeval>=1.5.0",
    "httpx",                       # For FastAPI test client
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: Pure unit tests — no I/O, no LLM, no database",
    "integration: Integration tests — real database (SQLite in CI)",
    "evaluation: DeepEval evaluation — requires LLM, run separately",
    "llm: Requires a live LLM connection — skip in CI",
]
addopts = "-m 'not llm and not evaluation'"

[tool.hatch.build.targets.wheel]
packages = ["uada"]
