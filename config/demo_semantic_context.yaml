version: "2.0"

database:
  name: "tachyoniq_enterprise_demo"
  description: >-
    Synthetic B2B SaaS commerce and customer-success warehouse with three years of
    revenue, profit, customer, product, service, usage, marketing and target history.
    Data is deterministic and paired with executable ground-truth evidence.
  dialect: "sqlite"
  timezone: "UTC"
  fiscal_year_start_month: 1

tables:
  - name: "orders"
    description: >-
      Commercial transactions at one product per order. Contains gross and net revenue,
      discount, cost, profit, fulfilment, campaign, seller and lifecycle status.
    grain: "order transaction"
    aliases: ["sales", "purchases", "transactions", "bookings"]
    columns:
      - {name: "id", type: "int", description: "Unique order identifier.", semantic_type: "identifier", is_primary_key: true}
      - {name: "customer_id", type: "int", description: "Customer account that placed the order.", semantic_type: "identifier", is_foreign_key: true, references: "customers.id"}
      - {name: "product_id", type: "int", description: "Product purchased.", semantic_type: "identifier", is_foreign_key: true, references: "products.id"}
      - {name: "order_date", type: "date", description: "UTC order date.", semantic_type: "temporal", is_temporal: true, default_time_column: true}
      - {name: "order_month", type: "date", description: "First day of the order month for stable monthly grouping.", semantic_type: "temporal", is_temporal: true}
      - {name: "quantity", type: "int", description: "Units purchased.", semantic_type: "measure", aggregation: "SUM", aliases: ["units"]}
      - {name: "gross_revenue", type: "float", description: "Value before discount in USD.", semantic_type: "measure", aggregation: "SUM", aliases: ["gross sales"]}
      - {name: "discount_amount", type: "float", description: "Discount granted in USD.", semantic_type: "measure", aggregation: "SUM"}
      - {name: "net_revenue", type: "float", description: "Revenue after discount in USD; exclude cancelled and refunded orders for recognized revenue.", semantic_type: "measure", aggregation: "SUM", aliases: ["sales", "revenue"]}
      - {name: "cost_amount", type: "float", description: "Direct product cost in USD.", semantic_type: "measure", aggregation: "SUM", aliases: ["cost of goods sold", "COGS"]}
      - {name: "profit", type: "float", description: "Net revenue less direct cost in USD.", semantic_type: "measure", aggregation: "SUM", aliases: ["gross profit"]}
      - {name: "status", type: "str", description: "Order lifecycle state.", semantic_type: "dimension", enum_values: ["delivered", "shipped", "pending", "cancelled", "refunded"]}
      - {name: "sales_channel", type: "str", description: "Channel that closed the order.", semantic_type: "dimension", enum_values: ["Self-Service", "Inside Sales", "Partner", "Field Sales"]}
      - {name: "sales_rep", type: "str", description: "Account executive credited with the order.", semantic_type: "dimension", aliases: ["seller", "representative"]}
      - {name: "campaign_name", type: "str", description: "Campaign associated with the order.", semantic_type: "dimension"}
      - {name: "promised_delivery_days", type: "int", description: "Committed fulfilment duration in days.", semantic_type: "measure", aggregation: "AVG"}
      - {name: "actual_delivery_days", type: "int", description: "Actual fulfilment duration; null until completion.", semantic_type: "measure", aggregation: "AVG"}
      - {name: "on_time_delivery", type: "int", description: "1 when delivered on or before the promise, 0 when late, null while incomplete.", semantic_type: "measure", aggregation: "AVG"}

  - name: "customers"
    description: >-
      Customer account master with segmentation, geography, industry, acquisition,
      lifecycle, company size and annual contract value.
    grain: "customer account"
    aliases: ["accounts", "clients", "companies", "organizations"]
    columns:
      - {name: "id", type: "int", description: "Unique customer account identifier.", semantic_type: "identifier", is_primary_key: true}
      - {name: "account_name", type: "str", description: "Synthetic customer company name.", semantic_type: "text", aliases: ["customer name", "company"]}
      - {name: "tier", type: "str", description: "Commercial plan tier.", semantic_type: "dimension", enum_values: ["Free", "Pro", "Enterprise"], aliases: ["plan"]}
      - {name: "segment", type: "str", description: "Go-to-market segment.", semantic_type: "dimension", enum_values: ["SMB", "Mid-Market", "Enterprise"]}
      - {name: "region", type: "str", description: "Customer sales geography.", semantic_type: "dimension", enum_values: ["North America", "Europe", "APAC", "LATAM"]}
      - {name: "country", type: "str", description: "Customer country.", semantic_type: "dimension"}
      - {name: "industry", type: "str", description: "Customer industry vertical.", semantic_type: "dimension"}
      - {name: "company_size", type: "str", description: "Small, Medium or Large employee band.", semantic_type: "dimension", enum_values: ["Small", "Medium", "Large"]}
      - {name: "employee_count", type: "int", description: "Approximate employees.", semantic_type: "measure", aggregation: "AVG"}
      - {name: "acquisition_channel", type: "str", description: "Original account acquisition source.", semantic_type: "dimension"}
      - {name: "signup_date", type: "date", description: "Account creation date.", semantic_type: "temporal", is_temporal: true, default_time_column: true}
      - {name: "account_status", type: "str", description: "Current lifecycle status.", semantic_type: "dimension", enum_values: ["Active", "Churned"]}
      - {name: "churn_date", type: "date", description: "Churn date for churned accounts; otherwise null.", semantic_type: "temporal", is_temporal: true}
      - {name: "annual_contract_value", type: "float", description: "Current annual contract value in USD.", semantic_type: "measure", aggregation: "SUM", aliases: ["ACV"]}

  - name: "products"
    description: "Product catalog with category hierarchy, pricing model, price and direct unit cost."
    grain: "sellable product SKU"
    aliases: ["catalog", "SKUs", "offerings"]
    columns:
      - {name: "id", type: "int", description: "Unique product identifier.", semantic_type: "identifier", is_primary_key: true}
      - {name: "product_name", type: "str", description: "Product and edition name.", semantic_type: "text", aliases: ["product"]}
      - {name: "category", type: "str", description: "Top-level product family.", semantic_type: "dimension", enum_values: ["Analytics", "Automation", "Security", "Data Platform", "Collaboration", "Customer Experience"]}
      - {name: "subcategory", type: "str", description: "Detailed product family.", semantic_type: "dimension"}
      - {name: "pricing_model", type: "str", description: "Subscription, Usage or Per Seat pricing.", semantic_type: "dimension"}
      - {name: "unit_price", type: "float", description: "Catalog unit price in USD.", semantic_type: "measure", aggregation: "AVG"}
      - {name: "unit_cost", type: "float", description: "Direct unit cost in USD.", semantic_type: "measure", aggregation: "AVG"}
      - {name: "launch_date", type: "date", description: "Product launch date.", semantic_type: "temporal", is_temporal: true, default_time_column: true}

  - name: "support_tickets"
    description: >-
      Customer support cases with category, priority, response and resolution time,
      satisfaction, escalation and reopening outcomes.
    grain: "support ticket"
    aliases: ["cases", "incidents", "service requests", "customer support"]
    columns:
      - {name: "id", type: "int", description: "Unique ticket identifier.", semantic_type: "identifier", is_primary_key: true}
      - {name: "customer_id", type: "int", description: "Customer that opened the ticket.", semantic_type: "identifier", is_foreign_key: true, references: "customers.id"}
      - {name: "order_id", type: "int", description: "Related order when applicable.", semantic_type: "identifier", is_foreign_key: true, references: "orders.id"}
      - {name: "created_date", type: "date", description: "Ticket creation date.", semantic_type: "temporal", is_temporal: true, default_time_column: true}
      - {name: "created_month", type: "date", description: "First day of ticket month.", semantic_type: "temporal", is_temporal: true}
      - {name: "category", type: "str", description: "Service issue category.", semantic_type: "dimension", enum_values: ["Billing", "How To", "Integration", "Performance", "Security", "Bug"]}
      - {name: "priority", type: "str", description: "Operational severity.", semantic_type: "dimension", enum_values: ["Low", "Medium", "High", "Critical"]}
      - {name: "status", type: "str", description: "Open or Closed ticket status.", semantic_type: "dimension", enum_values: ["Open", "Closed"]}
      - {name: "first_response_hours", type: "float", description: "Hours until first support response.", semantic_type: "measure", aggregation: "AVG"}
      - {name: "resolution_hours", type: "float", description: "Hours to close; null for open tickets.", semantic_type: "measure", aggregation: "AVG"}
      - {name: "csat_score", type: "float", description: "Customer satisfaction score from 1 to 5; null without a response.", semantic_type: "measure", aggregation: "AVG", aliases: ["CSAT"]}
      - {name: "escalated", type: "int", description: "1 for escalated tickets, otherwise 0.", semantic_type: "measure", aggregation: "SUM"}
      - {name: "reopened", type: "int", description: "1 when reopened after closure, otherwise 0.", semantic_type: "measure", aggregation: "SUM"}

  - name: "customer_monthly_metrics"
    description: >-
      Monthly account health snapshots covering subscription status, seats, active users,
      usage, feature adoption, MRR movement, NPS, churn risk and support burden.
    grain: "customer account per month"
    aliases: ["account health", "customer health", "usage", "subscriptions"]
    columns:
      - {name: "id", type: "int", description: "Unique monthly snapshot identifier.", semantic_type: "identifier", is_primary_key: true}
      - {name: "customer_id", type: "int", description: "Customer account.", semantic_type: "identifier", is_foreign_key: true, references: "customers.id"}
      - {name: "month", type: "date", description: "Snapshot month.", semantic_type: "temporal", is_temporal: true, default_time_column: true}
      - {name: "subscription_status", type: "str", description: "Active or Churned during this month.", semantic_type: "dimension", enum_values: ["Active", "Churned"]}
      - {name: "plan_tier", type: "str", description: "Plan tier during the month.", semantic_type: "dimension", enum_values: ["Free", "Pro", "Enterprise"]}
      - {name: "seats", type: "int", description: "Licensed seats.", semantic_type: "measure", aggregation: "SUM"}
      - {name: "active_users", type: "int", description: "Distinct active users during the month.", semantic_type: "measure", aggregation: "SUM"}
      - {name: "monthly_sessions", type: "int", description: "Total product sessions.", semantic_type: "measure", aggregation: "SUM"}
      - {name: "feature_adoption_pct", type: "float", description: "Percent of core capabilities adopted by the account.", semantic_type: "measure", aggregation: "AVG"}
      - {name: "mrr", type: "float", description: "Monthly recurring revenue at month end in USD.", semantic_type: "measure", aggregation: "SUM"}
      - {name: "expansion_mrr", type: "float", description: "MRR added through expansion in USD.", semantic_type: "measure", aggregation: "SUM"}
      - {name: "contraction_mrr", type: "float", description: "MRR lost through contraction in USD.", semantic_type: "measure", aggregation: "SUM"}
      - {name: "nps_score", type: "float", description: "Net Promoter Score response from -100 to 100 when surveyed.", semantic_type: "measure", aggregation: "AVG", aliases: ["NPS"]}
      - {name: "churn_risk_score", type: "float", description: "Synthetic risk score from 1 to 99; 70 or above is high risk.", semantic_type: "measure", aggregation: "AVG"}
      - {name: "support_tickets", type: "int", description: "Tickets opened by this account in the month.", semantic_type: "measure", aggregation: "SUM"}

  - name: "marketing_performance"
    description: >-
      Monthly campaign performance by marketing channel and region, including spend,
      funnel volumes, conversions and attributed revenue.
    grain: "month, channel, region and campaign"
    aliases: ["marketing", "campaigns", "funnel", "demand generation"]
    columns:
      - {name: "id", type: "int", description: "Unique performance row identifier.", semantic_type: "identifier", is_primary_key: true}
      - {name: "month", type: "date", description: "Performance month.", semantic_type: "temporal", is_temporal: true, default_time_column: true}
      - {name: "channel", type: "str", description: "Marketing channel.", semantic_type: "dimension"}
      - {name: "region", type: "str", description: "Target market region.", semantic_type: "dimension"}
      - {name: "campaign_name", type: "str", description: "Campaign name.", semantic_type: "dimension"}
      - {name: "spend", type: "float", description: "Marketing spend in USD.", semantic_type: "measure", aggregation: "SUM"}
      - {name: "impressions", type: "int", description: "Ad or content impressions.", semantic_type: "measure", aggregation: "SUM"}
      - {name: "clicks", type: "int", description: "Tracked clicks.", semantic_type: "measure", aggregation: "SUM"}
      - {name: "leads", type: "int", description: "Qualified leads.", semantic_type: "measure", aggregation: "SUM"}
      - {name: "conversions", type: "int", description: "Converted customers or orders attributed to marketing.", semantic_type: "measure", aggregation: "SUM"}
      - {name: "attributed_revenue", type: "float", description: "Revenue attributed to marketing in USD.", semantic_type: "measure", aggregation: "SUM"}

  - name: "business_kpi_monthly"
    description: >-
      Governed executive scorecard by month and region. Actual sales, targets, profit,
      customer activity, growth, marketing and service measures are aligned at one grain.
      Use this table for target attainment and cross-functional regional comparisons.
    grain: "month and region"
    aliases: ["scorecard", "executive KPIs", "business performance", "targets"]
    columns:
      - {name: "id", type: "int", description: "Unique scorecard row identifier.", semantic_type: "identifier", is_primary_key: true}
      - {name: "month", type: "date", description: "Scorecard month.", semantic_type: "temporal", is_temporal: true, default_time_column: true}
      - {name: "region", type: "str", description: "Business region.", semantic_type: "dimension"}
      - {name: "net_revenue", type: "float", description: "Recognized net revenue in USD.", semantic_type: "measure", aggregation: "SUM"}
      - {name: "revenue_target", type: "float", description: "Approved revenue target in USD.", semantic_type: "measure", aggregation: "SUM"}
      - {name: "profit", type: "float", description: "Recognized gross profit in USD.", semantic_type: "measure", aggregation: "SUM"}
      - {name: "profit_target", type: "float", description: "Approved profit target in USD.", semantic_type: "measure", aggregation: "SUM"}
      - {name: "order_count", type: "int", description: "Completed orders.", semantic_type: "measure", aggregation: "SUM"}
      - {name: "active_customers", type: "int", description: "Distinct purchasing customers.", semantic_type: "measure", aggregation: "SUM"}
      - {name: "new_accounts", type: "int", description: "Accounts created during the month.", semantic_type: "measure", aggregation: "SUM"}
      - {name: "churned_accounts", type: "int", description: "Accounts churned during the month.", semantic_type: "measure", aggregation: "SUM"}
      - {name: "marketing_spend", type: "float", description: "Marketing spend in USD.", semantic_type: "measure", aggregation: "SUM"}
      - {name: "support_tickets", type: "int", description: "Support tickets opened.", semantic_type: "measure", aggregation: "SUM"}
      - {name: "avg_csat", type: "float", description: "Average customer satisfaction score.", semantic_type: "measure", aggregation: "AVG"}

metrics:
  - {name: "net_revenue", description: "Recognized net revenue after discounts, excluding cancelled and refunded orders.", formula: "SUM(orders.net_revenue)", filters: "orders.status NOT IN ('cancelled', 'refunded')", unit: "USD", grain: "order", aliases: ["revenue", "sales", "recognized revenue"]}
  - {name: "gross_revenue", description: "Gross transaction value before discounts for non-cancelled orders.", formula: "SUM(orders.gross_revenue)", filters: "orders.status != 'cancelled'", unit: "USD", grain: "order", aliases: ["gross sales", "GMV"]}
  - {name: "profit", description: "Net revenue less direct cost for recognized orders.", formula: "SUM(orders.profit)", filters: "orders.status NOT IN ('cancelled', 'refunded')", unit: "USD", grain: "order", aliases: ["gross profit"]}
  - {name: "gross_margin_pct", description: "Profit divided by net revenue for recognized orders.", formula: "100.0 * SUM(orders.profit) / NULLIF(SUM(orders.net_revenue), 0)", filters: "orders.status NOT IN ('cancelled', 'refunded')", additivity: "non_additive", unit: "%", aliases: ["margin", "profit margin", "gross margin"]}
  - {name: "order_count", description: "Recognized order count excluding cancellations and refunds.", formula: "COUNT(orders.id)", filters: "orders.status NOT IN ('cancelled', 'refunded')", unit: "orders", aliases: ["orders", "number of orders", "transactions"]}
  - {name: "units_sold", description: "Units on recognized orders.", formula: "SUM(orders.quantity)", filters: "orders.status NOT IN ('cancelled', 'refunded')", unit: "units", aliases: ["quantity sold", "volume"]}
  - {name: "average_order_value", description: "Average net value of a recognized order.", formula: "AVG(orders.net_revenue)", filters: "orders.status NOT IN ('cancelled', 'refunded')", additivity: "non_additive", unit: "USD", aliases: ["AOV", "average transaction value"]}
  - {name: "discount_rate", description: "Discount amount divided by gross transaction value.", formula: "100.0 * SUM(orders.discount_amount) / NULLIF(SUM(orders.gross_revenue), 0)", filters: "orders.status != 'cancelled'", additivity: "non_additive", unit: "%", aliases: ["discount percentage"]}
  - {name: "refund_rate", description: "Percent of non-cancelled orders with refunded status.", formula: "100.0 * SUM(CASE WHEN orders.status = 'refunded' THEN 1 ELSE 0 END) / NULLIF(SUM(CASE WHEN orders.status != 'cancelled' THEN 1 ELSE 0 END), 0)", additivity: "non_additive", unit: "%", aliases: ["return rate"]}
  - {name: "on_time_delivery_rate", description: "Percent of completed deliveries fulfilled on time.", formula: "100.0 * AVG(orders.on_time_delivery)", filters: "orders.on_time_delivery IS NOT NULL", additivity: "non_additive", unit: "%", aliases: ["on time rate", "delivery SLA"]}
  - {name: "average_delivery_days", description: "Average actual fulfilment time for completed orders.", formula: "AVG(orders.actual_delivery_days)", filters: "orders.actual_delivery_days IS NOT NULL", additivity: "non_additive", unit: "days", aliases: ["fulfilment time", "shipping time"]}
  - {name: "purchasing_customer_count", description: "Distinct customer accounts that placed at least one order.", formula: "COUNT(DISTINCT orders.customer_id)", additivity: "non_additive", unit: "customers", aliases: ["customers who purchased", "buyers", "purchasing customers"]}
  - {name: "account_count", description: "Distinct customer accounts whether or not they purchased.", formula: "COUNT(DISTINCT customers.id)", additivity: "non_additive", unit: "accounts", aliases: ["customer accounts", "number of accounts", "total accounts"]}
  - {name: "active_account_count", description: "Current active customer accounts.", formula: "COUNT(DISTINCT customers.id)", filters: "customers.account_status = 'Active'", additivity: "non_additive", unit: "accounts", aliases: ["active accounts"]}
  - {name: "annual_contract_value", description: "Total annual contract value of accounts.", formula: "SUM(customers.annual_contract_value)", unit: "USD", grain: "customer", aliases: ["ACV", "contract value"]}
  - {name: "support_ticket_count", description: "Number of support tickets opened.", formula: "COUNT(support_tickets.id)", unit: "tickets", aliases: ["ticket volume", "cases"]}
  - {name: "average_first_response_hours", description: "Average time until the first support response.", formula: "AVG(support_tickets.first_response_hours)", additivity: "non_additive", unit: "hours", aliases: ["first response time"]}
  - {name: "average_resolution_hours", description: "Average time to close a support ticket.", formula: "AVG(support_tickets.resolution_hours)", filters: "support_tickets.resolution_hours IS NOT NULL", additivity: "non_additive", unit: "hours", aliases: ["resolution time", "time to resolve"]}
  - {name: "customer_satisfaction", description: "Average closed-ticket customer satisfaction score from 1 to 5.", formula: "AVG(support_tickets.csat_score)", filters: "support_tickets.csat_score IS NOT NULL", additivity: "non_additive", unit: "score", aliases: ["CSAT", "satisfaction"]}
  - {name: "escalation_rate", description: "Percent of support tickets escalated.", formula: "100.0 * AVG(support_tickets.escalated)", additivity: "non_additive", unit: "%", aliases: ["ticket escalation percentage"]}
  - {name: "monthly_recurring_revenue", description: "MRR at month end; additive across accounts but not across months.", formula: "SUM(customer_monthly_metrics.mrr)", additivity: "semi_additive", unit: "USD", aliases: ["MRR", "recurring revenue"]}
  - {name: "active_users", description: "Monthly active users; additive across accounts but not across months.", formula: "SUM(customer_monthly_metrics.active_users)", additivity: "semi_additive", unit: "users", aliases: ["MAU", "monthly active users"]}
  - {name: "feature_adoption", description: "Average account feature-adoption percentage.", formula: "AVG(customer_monthly_metrics.feature_adoption_pct)", additivity: "non_additive", unit: "%", aliases: ["product adoption", "adoption rate"]}
  - {name: "net_promoter_score", description: "Average available account NPS responses.", formula: "AVG(customer_monthly_metrics.nps_score)", filters: "customer_monthly_metrics.nps_score IS NOT NULL", additivity: "non_additive", unit: "score", aliases: ["NPS"]}
  - {name: "average_churn_risk", description: "Average modeled account churn-risk score from 1 to 99.", formula: "AVG(customer_monthly_metrics.churn_risk_score)", additivity: "non_additive", unit: "score", aliases: ["churn risk"]}
  - {name: "average_monthly_active_users", description: "Average monthly active users per account over the selected observation window.", formula: "AVG(customer_monthly_metrics.active_users)", additivity: "non_additive", unit: "users", aliases: ["average active users", "account usage"]}
  - {name: "average_monthly_support_tickets", description: "Average monthly support tickets per account over the selected observation window.", formula: "AVG(customer_monthly_metrics.support_tickets)", additivity: "non_additive", unit: "tickets", aliases: ["average support burden", "account support load"]}
  - {name: "high_risk_account_count", description: "Distinct accounts with a churn-risk score of 70 or above.", formula: "COUNT(DISTINCT customer_monthly_metrics.customer_id)", filters: "customer_monthly_metrics.churn_risk_score >= 70", additivity: "non_additive", unit: "accounts", aliases: ["at risk accounts", "high risk customers"]}
  - {name: "marketing_spend", description: "Total marketing investment.", formula: "SUM(marketing_performance.spend)", unit: "USD", aliases: ["ad spend", "campaign spend"]}
  - {name: "marketing_conversions", description: "Total attributed conversions.", formula: "SUM(marketing_performance.conversions)", unit: "conversions", aliases: ["conversions"]}
  - {name: "attributed_revenue", description: "Revenue attributed to marketing activity.", formula: "SUM(marketing_performance.attributed_revenue)", unit: "USD", aliases: ["marketing revenue"]}
  - {name: "return_on_ad_spend", description: "Attributed revenue divided by marketing spend.", formula: "SUM(marketing_performance.attributed_revenue) / NULLIF(SUM(marketing_performance.spend), 0)", additivity: "non_additive", unit: "ratio", aliases: ["ROAS", "marketing ROI"]}
  - {name: "click_through_rate", description: "Clicks divided by impressions.", formula: "100.0 * SUM(marketing_performance.clicks) / NULLIF(SUM(marketing_performance.impressions), 0)", additivity: "non_additive", unit: "%", aliases: ["CTR"]}
  - {name: "lead_conversion_rate", description: "Conversions divided by qualified leads.", formula: "100.0 * SUM(marketing_performance.conversions) / NULLIF(SUM(marketing_performance.leads), 0)", additivity: "non_additive", unit: "%", aliases: ["conversion rate"]}
  - {name: "revenue_target_attainment", description: "Actual recognized revenue divided by target at scorecard grain.", formula: "100.0 * SUM(business_kpi_monthly.net_revenue) / NULLIF(SUM(business_kpi_monthly.revenue_target), 0)", additivity: "non_additive", unit: "%", aliases: ["target attainment", "revenue achievement"]}
  - {name: "revenue_variance_to_target", description: "Actual revenue minus target.", formula: "SUM(business_kpi_monthly.net_revenue) - SUM(business_kpi_monthly.revenue_target)", unit: "USD", aliases: ["revenue gap", "target variance"]}
  - {name: "scorecard_revenue", description: "Recognized revenue from the governed executive scorecard.", formula: "SUM(business_kpi_monthly.net_revenue)", unit: "USD", aliases: ["executive revenue"]}
  - {name: "scorecard_revenue_target", description: "Approved revenue target from the governed executive scorecard.", formula: "SUM(business_kpi_monthly.revenue_target)", unit: "USD", aliases: ["executive revenue target"]}
  - {name: "scorecard_profit", description: "Recognized gross profit from the governed executive scorecard.", formula: "SUM(business_kpi_monthly.profit)", unit: "USD", aliases: ["executive profit"]}
  - {name: "scorecard_profit_margin_pct", description: "Profit divided by recognized revenue at the selected scorecard grain.", formula: "100.0 * SUM(business_kpi_monthly.profit) / NULLIF(SUM(business_kpi_monthly.net_revenue), 0)", additivity: "non_additive", unit: "%", aliases: ["executive profit margin"]}
  - {name: "scorecard_active_customers", description: "Active purchasing customer count at the selected scorecard grain.", formula: "SUM(business_kpi_monthly.active_customers)", additivity: "semi_additive", unit: "customers", aliases: ["executive active customers"]}
  - {name: "scorecard_new_accounts", description: "New customer accounts from the governed scorecard.", formula: "SUM(business_kpi_monthly.new_accounts)", unit: "accounts", aliases: ["executive new accounts"]}
  - {name: "scorecard_churned_accounts", description: "Churned customer accounts from the governed scorecard.", formula: "SUM(business_kpi_monthly.churned_accounts)", unit: "accounts", aliases: ["executive churn"]}
  - {name: "scorecard_support_tickets", description: "Support ticket volume from the governed scorecard.", formula: "SUM(business_kpi_monthly.support_tickets)", unit: "tickets", aliases: ["executive support"]}
  - {name: "scorecard_weighted_csat", description: "Ticket-weighted customer satisfaction from the governed scorecard.", formula: "SUM(business_kpi_monthly.avg_csat * business_kpi_monthly.support_tickets) / NULLIF(SUM(business_kpi_monthly.support_tickets), 0)", additivity: "non_additive", unit: "score", aliases: ["executive CSAT"]}
  - {name: "scorecard_marketing_spend", description: "Marketing investment from the governed scorecard.", formula: "SUM(business_kpi_monthly.marketing_spend)", unit: "USD", aliases: ["executive marketing spend"]}

analysis_profiles:
  - name: "recognized_revenue_forecast"
    description: "Governed recognized-revenue history used for forward projections."
    aliases: ["forecast revenue", "revenue forecast", "project revenue"]
    measures: ["net_revenue"]
    time_dimension: "order_date"
    time_bucket: "month"
    operations: ["descriptive", "trend", "forecast"]
  - name: "customer_churn_risk_review"
    description: "Analyzes the full customer population, ranks observed churn risk, and returns product-usage and support evidence."
    aliases: ["highest churn risk", "churn risk and what evidence", "accounts at risk"]
    measures:
      - "average_churn_risk"
      - "feature_adoption"
      - "average_monthly_active_users"
      - "average_monthly_support_tickets"
    dimensions: ["account_name"]
    operations: ["descriptive", "correlation", "driver_analysis"]
    question_type: "ranking"
    order_by: "average_churn_risk"
    order_direction: "desc"
    limit: 5000
    excluded_glossary_filters: ["high risk account"]
  - name: "executive_business_review"
    description: "Cross-functional monthly scorecard used for an evidence-backed executive review."
    aliases: ["executive summary", "business summary", "company performance overview"]
    measures:
      - "scorecard_revenue"
      - "scorecard_revenue_target"
      - "scorecard_profit"
      - "scorecard_profit_margin_pct"
      - "scorecard_active_customers"
      - "scorecard_new_accounts"
      - "scorecard_churned_accounts"
      - "scorecard_support_tickets"
      - "scorecard_weighted_csat"
      - "scorecard_marketing_spend"
    time_dimension: "month"
