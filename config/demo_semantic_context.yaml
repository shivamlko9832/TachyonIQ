  - name: "waste_contract_profitability"
    description: "Ranks synthetic waste-service contracts by observed operating margin with revenue and profit context."
    aliases: ["least profitable waste contracts", "lowest margin waste contracts", "waste contract profitability"]
    measures: ["waste_revenue", "waste_operating_profit", "waste_operating_margin_pct"]
    dimensions: ["contract_name"]
    operations: ["descriptive", "contribution"]
    question_type: "ranking"
    order_by: "waste_operating_margin_pct"
    order_direction: "asc"
