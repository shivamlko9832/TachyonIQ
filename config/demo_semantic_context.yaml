# UADA Semantic Context Layer (SCL) — Demo Database
# ====================================================
# Version: 1.0
#
# Hand-authored from the candidate SCL that scripts/onboard_db.py
# generated against data/demo.sqlite (a synthetic B2B SaaS dataset:
# customers on Free/Pro/Enterprise tiers buying software products).
#
# Conventions: Cube-compatible YAML (production migration path: Cube Core).

version: "1.0"

# ── Database metadata ────────────────────────────────────────────────────────
database:
  name: "uada_demo"
  description: "Demo B2B SaaS analytics database. Customers subscribe at a tier and place orders for software products; each order is a single product purchase."
  dialect: "sqlite"
  timezone: "UTC"
  fiscal_year_start_month: 1

# ── Tables ───────────────────────────────────────────────────────────────────
tables:

  - name: "orders"
    description: "Customer orders. One row per product purchase transaction."
    grain: "order"
    aliases:
      - "purchases"
      - "transactions"
    excluded: false
    columns:

      - name: "id"
        type: "int"
        description: "Unique order identifier."
        semantic_type: "identifier"
        is_primary_key: true

      - name: "customer_id"
        type: "int"
        description: "Foreign key to the customers table."
        semantic_type: "identifier"
        is_foreign_key: true
        references: "customers.id"

      - name: "product_id"
        type: "int"
        description: "Foreign key to the products table."
        semantic_type: "identifier"
        is_foreign_key: true
        references: "products.id"

      - name: "revenue"
        type: "float"
        description: "Revenue generated by this order, in USD. Already accounts for quantity -- do not multiply by anything else."
        semantic_type: "measure"
        aggregation: "SUM"

      - name: "status"
        type: "str"
        description: "Order lifecycle status. 'cancelled' and 'refunded' orders should usually be excluded from revenue figures."
        semantic_type: "dimension"
        enum_values:
          - "pending"
          - "shipped"
          - "delivered"
          - "cancelled"
          - "refunded"

      - name: "order_date"
        type: "str"
        description: "Date the order was placed (UTC), as an ISO 8601 date string ('YYYY-MM-DD')."
        semantic_type: "temporal"
        is_temporal: true
        default_time_column: true    # The primary time axis for revenue/order analysis.

  - name: "customers"
    description: "Customer accounts. One row per customer company."
    grain: "customer"
    aliases:
      - "accounts"
      - "clients"
    excluded: false
    columns:

      - name: "id"
        type: "int"
        description: "Unique customer identifier."
        semantic_type: "identifier"
        is_primary_key: true

      - name: "name"
        type: "str"
        description: "Customer company name."
        semantic_type: "text"

      - name: "tier"
        type: "str"
        description: "Subscription tier the customer is on. Enterprise is the highest tier."
        semantic_type: "dimension"
        enum_values:
          - "Free"
          - "Pro"
          - "Enterprise"

      - name: "region"
        type: "str"
        description: "Geographic region the customer is based in."
        semantic_type: "dimension"
        enum_values:
          - "North America"
          - "Europe"
          - "APAC"
          - "LATAM"

      - name: "signup_date"
        type: "str"
        description: "Date the customer signed up (UTC), as an ISO 8601 date string."
        semantic_type: "temporal"
        is_temporal: true
        default_time_column: true    # Secondary time axis, for cohort/signup questions.

  - name: "products"
    description: "Product catalog. One row per sellable product."
    grain: "product"
    aliases:
      - "catalog"
      - "SKUs"
    excluded: false
    columns:

      - name: "id"
        type: "int"
        description: "Unique product identifier."
        semantic_type: "identifier"
        is_primary_key: true

      - name: "name"
        type: "str"
        description: "Product name."
        semantic_type: "text"

      - name: "category"
        type: "str"
        description: "Product category."
        semantic_type: "dimension"
        enum_values:
          - "Analytics"
          - "Automation"
          - "Storage"
          - "Security"
          - "Collaboration"

      - name: "unit_price"
        type: "float"
        description: "List price for one unit, in USD. A catalog reference price -- not the same as orders.revenue, which reflects what was actually charged (quantity and any variance included)."
        semantic_type: "measure"

# ── Metrics ───────────────────────────────────────────────────────────────────
# Named, reusable measures with business logic encapsulated.

metrics:

  - name: "revenue"
    description: "Total net revenue across completed orders (cancelled orders excluded)."
    formula: "SUM(orders.revenue)"
    filters: "orders.status != 'cancelled'"
    unit: "USD"
    grain: "order"
    aliases:
      - "sales"
      - "total revenue"
      - "net revenue"

  - name: "order_count"
    description: "Number of orders placed (cancelled orders excluded)."
    formula: "COUNT(orders.id)"
    filters: "orders.status != 'cancelled'"
    unit: "orders"
    aliases:
      - "number of orders"
      - "orders placed"

  - name: "aov"
    description: "Average Order Value -- average revenue per order (cancelled orders excluded)."
    formula: "AVG(orders.revenue)"
    filters: "orders.status != 'cancelled'"
    unit: "USD"
    aliases:
      - "average order value"
      - "average transaction value"

  - name: "customer_count"
    description: "Number of distinct customers who have placed at least one order."
    formula: "COUNT(DISTINCT orders.customer_id)"
    unit: "customers"
    aliases:
      - "number of customers"
      - "distinct customers"

# ── Joins ─────────────────────────────────────────────────────────────────────
# Defines how tables connect. The Query Planner uses these to build JOIN clauses.

joins:

  - from_table: "orders"
    to_table: "customers"
    on: "orders.customer_id = customers.id"
    join_type: "LEFT"
    cardinality: "many_to_one"
    description: "Each order belongs to one customer."

  - from_table: "orders"
    to_table: "products"
    on: "orders.product_id = products.id"
    join_type: "LEFT"
    cardinality: "many_to_one"
    description: "Each order is for one product."

# ── Glossary ──────────────────────────────────────────────────────────────────
# Business terms → SQL filter translations.

glossary:

  - term: "enterprise customer"
    description: "A customer on the Enterprise subscription tier."
    sql_filter: "customers.tier = 'Enterprise'"
    applies_to_table: "customers"
    aliases:
      - "enterprise customers"
      - "enterprise accounts"
      - "enterprise tier"
      - "enterprise"

  - term: "active customer"
    description: "A customer with at least one order in the last 90 days."
    sql_filter: "orders.order_date >= date('now', '-90 days')"
    applies_to_table: "orders"
    aliases:
      - "active customers"
      - "recently active"

  - term: "cancelled order"
    description: "An order with status 'cancelled'."
    sql_filter: "orders.status = 'cancelled'"
    applies_to_table: "orders"
    aliases:
      - "cancelled orders"
      - "canceled order"
      - "canceled orders"

  - term: "APAC"
    description: "Customers based in the Asia-Pacific region."
    sql_filter: "customers.region = 'APAC'"
    applies_to_table: "customers"
    aliases:
      - "asia pacific"
      - "asia-pacific customers"

# ── Example queries ───────────────────────────────────────────────────────────
# Worked Q&A pairs. Retrieved as few-shot examples during SQL generation.

examples:

  - question: "What was total revenue last quarter?"
    sql: |
      SELECT SUM(orders.revenue) AS revenue
      FROM orders
      WHERE orders.status != 'cancelled'
        AND orders.order_date >= date('now', '-3 months')
    intent_type: "aggregation"
    description: "Simple aggregation with a rolling relative time filter."

  - question: "Show monthly revenue for the last 12 months"
    sql: |
      SELECT
        strftime('%Y-%m', orders.order_date) AS period,
        SUM(orders.revenue) AS revenue
      FROM orders
      WHERE orders.status != 'cancelled'
        AND orders.order_date >= date('now', '-12 months')
      GROUP BY period
      ORDER BY period
    intent_type: "time_series"
    description: "Time series bucketed by month."

  - question: "Top 10 customers by revenue"
    sql: |
      SELECT
        customers.name,
        SUM(orders.revenue) AS revenue
      FROM orders
      LEFT JOIN customers ON orders.customer_id = customers.id
      WHERE orders.status != 'cancelled'
      GROUP BY customers.id, customers.name
      ORDER BY revenue DESC
      LIMIT 10
    intent_type: "ranking"
    description: "Ranking across a join, with LIMIT."

  - question: "Compare revenue this year vs last year"
    sql: |
      SELECT
        strftime('%Y', orders.order_date) AS year,
        SUM(orders.revenue) AS revenue
      FROM orders
      WHERE orders.status != 'cancelled'
        AND orders.order_date >= date('now', 'start of year', '-1 year')
      GROUP BY year
      ORDER BY year
    intent_type: "comparison"
    description: "Period-over-period comparison."

  - question: "Show revenue from enterprise customers"
    sql: |
      SELECT SUM(orders.revenue) AS revenue
      FROM orders
      LEFT JOIN customers ON orders.customer_id = customers.id
      WHERE orders.status != 'cancelled'
        AND customers.tier = 'Enterprise'
    intent_type: "aggregation"
    description: "Filter resolved from the 'enterprise customer' glossary term."

  - question: "What is the top-selling product category by revenue?"
    sql: |
      SELECT
        products.category,
        SUM(orders.revenue) AS revenue
      FROM orders
      LEFT JOIN products ON orders.product_id = products.id
      WHERE orders.status != 'cancelled'
      GROUP BY products.category
      ORDER BY revenue DESC
      LIMIT 1
    intent_type: "ranking"
    description: "Multi-table join (orders -> products) grouped by a dimension from the joined table."

  - question: "Only show enterprise customers"
    sql: |
      SELECT
        customers.region,
        SUM(orders.revenue) AS revenue
      FROM orders
      LEFT JOIN customers ON orders.customer_id = customers.id
      WHERE orders.status != 'cancelled'
        AND customers.tier = 'Enterprise'
      GROUP BY customers.region
      ORDER BY revenue DESC
    intent_type: "follow_up_refine"
    description: "Follow-up to a prior 'revenue by region' question, adding an enterprise-tier filter without repeating the original grouping in the question text."

  - question: "Why did revenue decline last month?"
    sql: |
      SELECT
        products.category,
        SUM(orders.revenue) AS revenue,
        COUNT(orders.id) AS order_count
      FROM orders
      LEFT JOIN products ON orders.product_id = products.id
      WHERE orders.status != 'cancelled'
        AND orders.order_date >= date('now', 'start of month', '-1 month')
        AND orders.order_date < date('now', 'start of month')
      GROUP BY products.category
      ORDER BY revenue DESC
    intent_type: "diagnostic"
    description: "Diagnostic breakdown by category for the prior month, to help explain a revenue change."

# ── Security policy ───────────────────────────────────────────────────────────
security:

  # No purely-internal tables in this demo schema (no audit logs, session
  # tables, credential stores, etc.) -- this list documents that the
  # mechanism exists and is checked, not that anything is currently excluded.
  excluded_tables: []

  # No columns in this demo schema hold PII or credentials sensitive enough
  # to exclude (company/product names and enum-like dimensions only).
  excluded_columns: []

  # Row-level filters (future use — not enforced in POC)
  row_filters: {}
