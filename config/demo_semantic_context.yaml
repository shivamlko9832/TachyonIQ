      - "scorecard_marketing_spend"
    time_dimension: "month"
    time_bucket: "month"
    operations: ["executive_summary", "descriptive", "trend", "anomaly"]

joins:
  - {from_table: "orders", to_table: "customers", on: "orders.customer_id = customers.id", join_type: "LEFT", cardinality: "many_to_one", description: "Each order belongs to one customer account."}
  - {from_table: "orders", to_table: "products", on: "orders.product_id = products.id", join_type: "LEFT", cardinality: "many_to_one", description: "Each order contains one catalog product in this demo."}
  - {from_table: "support_tickets", to_table: "customers", on: "support_tickets.customer_id = customers.id", join_type: "LEFT", cardinality: "many_to_one", description: "Each ticket belongs to one customer."}
  - {from_table: "support_tickets", to_table: "orders", on: "support_tickets.order_id = orders.id", join_type: "LEFT", cardinality: "many_to_one", description: "A ticket may reference one order."}
  - {from_table: "customer_monthly_metrics", to_table: "customers", on: "customer_monthly_metrics.customer_id = customers.id", join_type: "LEFT", cardinality: "many_to_one", description: "Each health snapshot belongs to one customer."}
  - {from_table: "wm_finance_monthly", to_table: "wm_contracts", on: "wm_finance_monthly.contract_id = wm_contracts.id", join_type: "LEFT", cardinality: "many_to_one", description: "Each contract-month financial fact belongs to exactly one governed waste-service contract."}
  - {from_table: "wm_contracts", to_table: "wm_customers", on: "wm_contracts.customer_id = wm_customers.id", join_type: "LEFT", cardinality: "many_to_one", description: "Each waste-service contract belongs to exactly one synthetic customer account."}

glossary:
  - {term: "complete waste history", description: "All complete synthetic waste reporting months from 2023-09-01 through 2026-08-31.", sql_filter: "wm_finance_monthly.month >= '2023-09-01' AND wm_finance_monthly.month < '2026-09-01'", applies_to_table: "wm_finance_monthly", aliases: ["complete waste months"]}
  - {term: "2026 waste YTD", description: "Eight complete waste reporting months from January through August 2026.", sql_filter: "wm_finance_monthly.month >= '2026-01-01' AND wm_finance_monthly.month < '2026-09-01'", applies_to_table: "wm_finance_monthly", aliases: ["waste year to date"]}
  - {term: "active waste contract", description: "A waste-service contract whose current status is Active.", sql_filter: "wm_contracts.contract_status = 'Active'", applies_to_table: "wm_contracts", aliases: ["active contract"]}
  - {term: "West waste region", description: "Synthetic West operating region.", sql_filter: "wm_customers.region = 'West'", applies_to_table: "wm_customers", aliases: ["waste West"]}
  - {term: "recognized order", description: "An order that is not cancelled or refunded.", sql_filter: "orders.status NOT IN ('cancelled', 'refunded')", applies_to_table: "orders", aliases: ["completed business", "valid order"]}
  - {term: "enterprise customer", description: "A customer on the Enterprise tier.", sql_filter: "customers.tier = 'Enterprise'", applies_to_table: "customers", aliases: ["enterprise account", "enterprise client"]}
  - {term: "active account", description: "An account whose current status is Active.", sql_filter: "customers.account_status = 'Active'", applies_to_table: "customers", aliases: ["live customer"]}
  - {term: "high risk account", description: "An account-month with churn risk at least 70.", sql_filter: "customer_monthly_metrics.churn_risk_score >= 70", applies_to_table: "customer_monthly_metrics", aliases: ["at risk customer", "likely to churn"]}
  - {term: "healthy adoption", description: "Account feature adoption of at least 70 percent.", sql_filter: "customer_monthly_metrics.feature_adoption_pct >= 70", applies_to_table: "customer_monthly_metrics", aliases: ["high adoption"]}
  - {term: "critical ticket", description: "A support ticket with Critical priority.", sql_filter: "support_tickets.priority = 'Critical'", applies_to_table: "support_tickets", aliases: ["critical case", "sev one"]}
  - {term: "APAC", description: "Asia-Pacific business region.", sql_filter: "customers.region = 'APAC'", applies_to_table: "customers", aliases: ["Asia Pacific"]}
  - {term: "recent six months", description: "The six complete months from 2026-03-01 through 2026-08-31 in this fixed demo.", sql_filter: "orders.order_date >= '2026-03-01' AND orders.order_date < '2026-09-01'", applies_to_table: "orders", aliases: ["latest six complete months"]}

examples:
  - question: "What were waste revenue and operating margin by month in 2026?"
    intent_type: "time_series"
    sql: |
      SELECT month AS period, SUM(revenue) AS waste_revenue,
             100.0*SUM(operating_profit)/NULLIF(SUM(revenue),0) AS waste_operating_margin_pct
      FROM wm_finance_monthly
      WHERE month>='2026-01-01' AND month<'2026-09-01'
      GROUP BY month ORDER BY month
    description: "Observed monthly actuals at the governed contract-month grain."
  - question: "Which regions contributed most to the 2026 waste margin change?"
    intent_type: "diagnostic"
    sql: |
      SELECT c.region, SUM(f.revenue) AS waste_revenue,
             SUM(f.fuel_cost) AS waste_fuel_cost, SUM(f.labor_cost) AS waste_labor_cost,
             SUM(f.disposal_cost) AS waste_disposal_cost, SUM(f.fleet_cost) AS waste_fleet_cost,
             100.0*SUM(f.operating_profit)/NULLIF(SUM(f.revenue),0) AS waste_operating_margin_pct
      FROM wm_finance_monthly f
      JOIN wm_contracts k ON k.id=f.contract_id
      JOIN wm_customers c ON c.id=k.customer_id
      WHERE f.month>='2026-01-01' AND f.month<'2026-09-01'
      GROUP BY c.region ORDER BY waste_operating_margin_pct
    description: "Observed regional contributors; the output must not be described as causal."
  - question: "Show waste revenue, margin and collection tons by service line."
    intent_type: "aggregation"
    sql: |
      SELECT c.service_line, SUM(f.revenue) AS waste_revenue,
             100.0*SUM(f.operating_profit)/NULLIF(SUM(f.revenue),0) AS waste_operating_margin_pct,
             SUM(f.collection_volume_tons) AS waste_collection_volume
      FROM wm_finance_monthly f JOIN wm_contracts c ON c.id=f.contract_id
      GROUP BY c.service_line ORDER BY waste_revenue DESC
  - question: "Which waste customers have the largest overdue receivables in August 2026?"
    intent_type: "ranking"
    sql: |
      SELECT c.customer_name, SUM(f.overdue_ar_balance) AS waste_overdue_ar,
             AVG(f.days_sales_outstanding) AS waste_dso
      FROM wm_finance_monthly f
      JOIN wm_contracts k ON k.id=f.contract_id
      JOIN wm_customers c ON c.id=k.customer_id
      WHERE f.month='2026-08-01'
      GROUP BY c.customer_name ORDER BY waste_overdue_ar DESC LIMIT 10
  - question: "What is recognized revenue and profit by month for the last 12 months?"
    intent_type: "time_series"
    sql: |
      SELECT order_month AS period, SUM(net_revenue) AS net_revenue, SUM(profit) AS profit
      FROM orders
      WHERE status NOT IN ('cancelled','refunded') AND order_date >= '2025-09-01'
      GROUP BY order_month ORDER BY order_month
    description: "Two additive financial metrics with the governed recognized-order population."
  - question: "Which product categories have the highest revenue and margin?"
    intent_type: "ranking"
    sql: |
      SELECT p.category, SUM(o.net_revenue) AS net_revenue,
             100.0 * SUM(o.profit) / NULLIF(SUM(o.net_revenue),0) AS gross_margin_pct
      FROM orders o JOIN products p ON p.id=o.product_id
      WHERE o.status NOT IN ('cancelled','refunded')
      GROUP BY p.category ORDER BY net_revenue DESC LIMIT 10
  - question: "Compare Europe's recent six months with the previous six months."
    intent_type: "comparison"
    sql: |
      SELECT CASE WHEN o.order_date >= '2026-03-01' THEN 'recent six months'
                  ELSE 'previous six months' END AS period,
             SUM(o.net_revenue) AS net_revenue, COUNT(o.id) AS order_count
      FROM orders o JOIN customers c ON c.id=o.customer_id
      WHERE c.region='Europe' AND o.status NOT IN ('cancelled','refunded')
        AND o.order_date >= '2025-09-01' AND o.order_date < '2026-09-01'
      GROUP BY period ORDER BY period
  - question: "Which regions are below revenue target this year?"
    intent_type: "ranking"
    sql: |
      SELECT region, SUM(net_revenue) AS net_revenue, SUM(revenue_target) AS revenue_target,
             100.0*SUM(net_revenue)/NULLIF(SUM(revenue_target),0) AS attainment_pct
      FROM business_kpi_monthly WHERE month >= '2026-01-01'
      GROUP BY region HAVING SUM(net_revenue) < SUM(revenue_target)
      ORDER BY attainment_pct LIMIT 10
  - question: "What is the refund rate by sales channel?"
    intent_type: "aggregation"
    sql: |
      SELECT sales_channel,
             100.0*SUM(CASE WHEN status='refunded' THEN 1 ELSE 0 END)
             /NULLIF(SUM(CASE WHEN status!='cancelled' THEN 1 ELSE 0 END),0) AS refund_rate
      FROM orders GROUP BY sales_channel ORDER BY refund_rate DESC
  - question: "Show the top 10 customers by recognized revenue and profit."
    intent_type: "ranking"
    sql: |
      SELECT c.account_name, SUM(o.net_revenue) AS net_revenue, SUM(o.profit) AS profit
      FROM orders o JOIN customers c ON c.id=o.customer_id
      WHERE o.status NOT IN ('cancelled','refunded')
      GROUP BY c.id,c.account_name ORDER BY net_revenue DESC LIMIT 10
  - question: "How does discount rate vary by region and tier?"
    intent_type: "aggregation"
    sql: |
      SELECT c.region,c.tier,
             100.0*SUM(o.discount_amount)/NULLIF(SUM(o.gross_revenue),0) AS discount_rate
      FROM orders o JOIN customers c ON c.id=o.customer_id WHERE o.status!='cancelled'
      GROUP BY c.region,c.tier ORDER BY discount_rate DESC LIMIT 100
  - question: "Which sales representatives generated the most profit this year?"
    intent_type: "ranking"
    sql: |
      SELECT sales_rep,SUM(profit) AS profit,SUM(net_revenue) AS net_revenue
      FROM orders WHERE status NOT IN ('cancelled','refunded') AND order_date>='2026-01-01'
      GROUP BY sales_rep ORDER BY profit DESC LIMIT 10
  - question: "What caused the APAC revenue spike in August 2026?"
    intent_type: "diagnostic"
    sql: |
      SELECT p.category,o.sales_channel,o.campaign_name,COUNT(*) AS orders,
             SUM(o.net_revenue) AS net_revenue,MAX(o.net_revenue) AS largest_order
      FROM orders o JOIN customers c ON c.id=o.customer_id
      JOIN products p ON p.id=o.product_id
      WHERE c.region='APAC' AND o.order_date>='2026-08-01' AND o.order_date<'2026-09-01'
        AND o.status NOT IN ('cancelled','refunded')
      GROUP BY p.category,o.sales_channel,o.campaign_name ORDER BY net_revenue DESC LIMIT 20
  - question: "Show MRR and active users by plan tier over the last year."
    intent_type: "time_series"
    sql: |
      SELECT month,plan_tier,SUM(mrr) AS mrr,SUM(active_users) AS active_users
      FROM customer_monthly_metrics WHERE month>='2025-09-01'
      GROUP BY month,plan_tier ORDER BY month,plan_tier
  - question: "How many accounts are high risk in the latest month?"
    intent_type: "aggregation"
    sql: |
      SELECT COUNT(DISTINCT customer_id) AS high_risk_account_count
      FROM customer_monthly_metrics
      WHERE month='2026-09-01' AND churn_risk_score>=70
  - question: "Does low adoption coincide with higher churn risk?"
    intent_type: "diagnostic"
    sql: |
      SELECT CASE WHEN feature_adoption_pct<40 THEN 'Low'
                  WHEN feature_adoption_pct<70 THEN 'Medium' ELSE 'High' END AS adoption_band,
             COUNT(*) AS observations,AVG(churn_risk_score) AS average_churn_risk,
             AVG(support_tickets) AS average_support_tickets
      FROM customer_monthly_metrics GROUP BY adoption_band ORDER BY average_churn_risk DESC
  - question: "Which customer segments have the best NPS and adoption?"
    intent_type: "ranking"
    sql: |
      SELECT c.segment,AVG(m.nps_score) AS nps,AVG(m.feature_adoption_pct) AS adoption
      FROM customer_monthly_metrics m JOIN customers c ON c.id=m.customer_id
      WHERE m.nps_score IS NOT NULL GROUP BY c.segment ORDER BY nps DESC LIMIT 10
  - question: "What is support ticket volume and CSAT by priority?"
    intent_type: "aggregation"
    sql: |
      SELECT priority,COUNT(*) AS support_ticket_count,AVG(csat_score) AS customer_satisfaction,
             AVG(resolution_hours) AS average_resolution_hours
      FROM support_tickets GROUP BY priority ORDER BY support_ticket_count DESC
  - question: "Which support categories breach resolution expectations?"
    intent_type: "ranking"
    sql: |
      SELECT category,COUNT(*) AS tickets,AVG(resolution_hours) AS resolution_hours,
             100.0*AVG(escalated) AS escalation_rate
      FROM support_tickets WHERE resolution_hours IS NOT NULL
      GROUP BY category ORDER BY resolution_hours DESC LIMIT 10
  - question: "Which marketing channels have the strongest ROAS?"
    intent_type: "ranking"
    sql: |
      SELECT channel,SUM(attributed_revenue)/NULLIF(SUM(spend),0) AS roas,
             SUM(spend) AS spend,SUM(conversions) AS conversions
      FROM marketing_performance GROUP BY channel ORDER BY roas DESC LIMIT 10
  - question: "Show the marketing funnel by region."
    intent_type: "aggregation"
    sql: |
      SELECT region,SUM(impressions) AS impressions,SUM(clicks) AS clicks,
             SUM(leads) AS leads,SUM(conversions) AS conversions
      FROM marketing_performance GROUP BY region ORDER BY conversions DESC
  - question: "How did the Secure Growth campaign perform in APAC?"
    intent_type: "aggregation"
    sql: |
      SELECT SUM(spend) AS spend,SUM(attributed_revenue) AS attributed_revenue,
             SUM(attributed_revenue)/NULLIF(SUM(spend),0) AS roas,
             SUM(conversions) AS conversions
      FROM marketing_performance WHERE region='APAC' AND campaign_name='Secure Growth'
  - question: "What is the on-time delivery rate by region?"
    intent_type: "aggregation"
    sql: |
      SELECT c.region,100.0*AVG(o.on_time_delivery) AS on_time_delivery_rate,
             AVG(o.actual_delivery_days) AS average_delivery_days
      FROM orders o JOIN customers c ON c.id=o.customer_id
      WHERE o.on_time_delivery IS NOT NULL GROUP BY c.region ORDER BY on_time_delivery_rate DESC
  - question: "How many customer accounts exist and how many have purchased?"
    intent_type: "comparison"
    sql: |
      SELECT (SELECT COUNT(*) FROM customers) AS account_count,
             (SELECT COUNT(DISTINCT customer_id) FROM orders) AS purchasing_customer_count

