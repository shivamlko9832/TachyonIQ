    measures: ["waste_revenue"]
    time_dimension: "month"
    time_bucket: "month"
    operations: ["descriptive", "trend", "forecast"]
  - name: "waste_receivables_review"
    description: "Ending accounts receivable, overdue balance, cash collections and DSO at valid monthly grain."
    aliases: ["waste receivables", "waste accounts receivable", "waste collections review"]
    measures: ["waste_ar_balance", "waste_overdue_ar", "waste_cash_collected", "waste_dso"]
